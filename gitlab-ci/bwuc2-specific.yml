bwuc2-mpi-multinode-job-singularity:
  dependencies: []
  stage: system-specific
  tags:
    - slurm
    - singularity
  variables:
    COMMAND_OPTIONS_SBATCH: "--partition dev_multiple -t 20 --ntasks 2 --nodes 2 --ntasks-per-node=1"
  script:
    - |
      srun hostname
      [ "$(srun hostname | sort -u | wc -l)" -eq 2 ] || exit 1

