unit-test-parallel-bootstrap-enroot:
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: bootstrap
  script:
    - make test-report-parallel JOBS=8
  after_script:
    - make joker
  tags:
    - slurm-enroot-test
  artifacts:
    when: always
    paths:
      - report-parallel.xml
    reports:
      junit: report-parallel.xml

unit-test-serial-bootstrap-enroot:
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: bootstrap
  script:
    - make test-report-serial
  after_script:
    - make joker
  tags:
    - slurm-enroot-test
  artifacts:
    when: always
    paths:
      - report-serial.xml
    reports:
      junit: report-serial.xml

lint-bootstrap-enroot:
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: bootstrap
  script:
    - make shellcheck
  tags:
    - slurm-enroot-test
