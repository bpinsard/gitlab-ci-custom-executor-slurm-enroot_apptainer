unit-test-parallel-test-deploy:
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test-deploy
  script:
    - make test-report-parallel JOBS=8
  after_script:
    - make joker
  tags:
    - slurm
    - enroot
  artifacts:
    when: always
    paths:
      - report-parallel.xml
    reports:
      junit: report-parallel.xml

unit-test-serial-test-deploy:
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test-deploy
  script:
    - make test-report-serial
  after_script:
    - make joker
  tags:
    - slurm
    - enroot
  artifacts:
    when: always
    paths:
      - report-serial.xml
    reports:
      junit: report-serial.xml

lint-test-deploy:
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test-deploy
  script:
    - make shellcheck
  tags:
    - slurm
    - enroot
