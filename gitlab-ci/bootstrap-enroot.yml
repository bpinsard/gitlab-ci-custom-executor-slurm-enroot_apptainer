enroot-unit-test-parallel-test-deploy:
  when: manual # This test is redundant
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    JOB_TIME_SEC: 1800
  stage: test-deploy
  script:
    - make test_report_parallel_no_skipped_local.xml JOBS=8
  tags:
    - slurm
    - enroot
  artifacts:
    when: always
    paths:
      - test_report_parallel_no_skipped_local.xml
    reports:
      junit: test_report_parallel_no_skipped_local.xml

enroot-unit-test-critical-test-deploy:
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    JOB_TIME_SEC: 3600
  stage: test-deploy-serial-enroot
  script:
    - make test_report_critical.xml
  tags:
    - slurm
    - enroot
  artifacts:
    when: always
    paths:
      - test_report_critical.xml
    reports:
      junit: test_report_critical.xml

enroot-lint-test-deploy:
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test-deploy
  script:
    - make shellcheck
  tags:
    - slurm
    - enroot
