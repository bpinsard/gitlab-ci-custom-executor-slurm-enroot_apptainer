enroot-unit-test-parallel-test-deploy:
  when: manual # This test is redundant
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    JOB_TIME_SEC: 1800
  stage: test-deploy
  script:
    - make test_report_parallel_no_skipped_local.xml JOBS=8
  tags:
    - slurm
    - enroot
  artifacts:
    when: always
    paths:
      - test_report_parallel_no_skipped_local.xml
    reports:
      junit: test_report_parallel_no_skipped_local.xml


# Tests that do not depend on slurm
# can be run in a slurm allocation
# (Runner on compute node)
enroot-unit-test-critical-noslurmalloc-test-deploy:
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    JOB_TIME_SEC: 3600
  stage: test-deploy-serial-enroot
  script:
    - make test_report_critical_noslurmalloc.xml
  tags:
    - slurm
    - enroot
  artifacts:
    when: always
    paths:
      - test_report_critical_noslurmalloc.xml
    reports:
      junit: test_report_critical_noslurmalloc.xml

# Tests that depend on slurm
# should not be run in a slurm allocation
# which is time-limited
# (Better run on a compute node)
enroot-unit-test-critical-slurmalloc-test-deploy:
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    JOB_TIME_SEC: 3600
  stage: test-deploy-serial-enroot
  script:
    - make test_report_critical_slurmalloc.xml
  tags:
    - noslurm
    - enroot
  artifacts:
    when: always
    paths:
      - test_report_critical_slurmalloc.xml
    reports:
      junit: test_report_critical_slurmalloc.xml


enroot-lint-test-deploy:
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test-deploy
  script:
    - make shellcheck
  tags:
    - slurm
    - enroot
