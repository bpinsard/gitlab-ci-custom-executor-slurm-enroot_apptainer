enroot-unit-test-parallel-test-deploy:
  when: manual # This test is redundant
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    JOB_TIME_SEC: 1800
  stage: test-deploy
  script:
    - make test-report-parallel-no-skipped-local JOBS=8 > report_parallel_enroot.xml
  tags:
    - slurm
    - enroot
  artifacts:
    when: always
    paths:
      - report_parallel_enroot.xml
    reports:
      junit: report-parallel_enroot.xml

enroot-unit-test-critical-test-deploy:
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test-deploy-serial-enroot
  script:
    - make test-report-critical > report_critical_enroot.xml
  tags:
    - slurm
    - enroot
  artifacts:
    when: always
    paths:
      - report_critical_enroot.xml
    reports:
      junit: report_critical_enroot.xml

enroot-lint-test-deploy:
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test-deploy
  script:
    - make shellcheck
  tags:
    - slurm
    - enroot
