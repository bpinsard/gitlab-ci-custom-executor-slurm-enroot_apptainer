minimal-job-apptainer:
  dependencies: []
  stage: test-test-deploy
  tags:
    # This needs to match the tag of the test custom executor
    - slurm
    - apptainer
  script:
    - echo "Test Test"
    - env | sort

image-job-apptainer:
  dependencies: []
  stage: test-test-deploy
  image: docker://debian:latest
  tags:
    # This needs to match the tag of the test custom executor
    - slurm
    - apptainer
  script:
    - echo "Test Test using an image"
    - grep PRETTY /etc/os-release
    - env | sort

artifact-job-apptainer:
  dependencies: []
  stage: test-test-deploy
  tags:
    # This needs to match the tag of the test custom executor
    - slurm
    - apptainer
  script: touch test-artifact.txt
  artifacts:
    paths:
      - test-artifact.txt

artifact-image-job-apptainer:
  dependencies: []
  stage: test-test-deploy
  image: docker://debian:latest
  tags:
    # This needs to match the tag of the test custom executor
    - slurm
    - apptainer
  script: cp /etc/os-release test-artifact-image.txt
  artifacts:
    paths:
      - test-artifact-image.txt


env-job-apptainer:
  dependencies: []
  stage: test-test-deploy
  tags:
    - slurm
    - apptainer
  variables:
    ENV_VAR_1: 55
  script:
    - env | grep ENV_VAR_1
    - test $ENV_VAR_1 -eq 55

apptainer-exec-options-test:
   dependencies: []
  stage: test-test-deploy
  tags:
    - slurm
    - apptainer
  variables:
    APPTAINER_EXEC_OPTIONS: "--env THEANSWER=42"
  script:
    - 'test $THEANSWER -eq 42'
