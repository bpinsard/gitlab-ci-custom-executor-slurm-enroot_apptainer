unit-test-parallel-test-deploy:
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    JOB_TIME_SEC: 1800
  stage: test-deploy
  script:
    - make test-report-parallel JOBS=8
    #- ./tests/bats/bin/bats ./tests/*
  tags:
    - slurm
    - nocontainer
  artifacts:
    when: always
    paths:
      - report-parallel.xml
    reports:
      junit: report-parallel.xml


unit-test-serial-test-deploy:
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test-deploy-serial-none
  script:
    - make test-report-serial
  tags:
    - slurm
    - nocontainer
  artifacts:
    when: always
    paths:
      - report-serial.xml
    reports:
      junit: report-serial.xml


lint-test-deploy:
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test-deploy
  script:
    - make shellcheck
  tags:
    - slurm
    - nocontainer
