unit-test-parallel-test-deploy:
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    JOB_TIME_SEC: 1800
  stage: test-deploy
  script:
    - make test-report-parallel-no-skipped-local JOBS=8 > report_parallel.xml
  tags:
    - slurm
    - nocontainer
  artifacts:
    when: always
    paths:
      - report_parallel.xml
    reports:
      junit: report_parallel.xml


unit-test-serial-test-deploy:
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test-deploy-serial-none
  script:
    - make test-report-serial > report_serial.xml
  tags:
    - slurm
    - nocontainer
  artifacts:
    when: always
    paths:
      - report_serial.xml
    reports:
      junit: report_serial.xml


lint-test-deploy:
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test-deploy
  script:
    - make shellcheck
  tags:
    - slurm
    - nocontainer
