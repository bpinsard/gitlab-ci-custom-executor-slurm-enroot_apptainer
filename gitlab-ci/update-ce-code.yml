update-ce-code:
  dependencies: []
  stage: test-deploy
  tags:
    - shell
  script:
    # This needs to match the one used in the configured test custom executor
    # This variable needs to be present in CI/CD settings
    - test -n "$CI_TEST_CODE"
    - test -d "$CI_TEST_CODE"
    - cd "$CI_TEST_CODE"
    - git pull $CI_REPOSITORY_URL
    - git checkout "$CI_COMMIT_BRANCH"
