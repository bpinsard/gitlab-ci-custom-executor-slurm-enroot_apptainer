

update-ce-code:
  dependencies:
    - tar-package
  stage: test-deploy
  tags:
    - shell
  script:
    # This needs to match the one used in the configured test custom executor
    # This variable needs to be present in CI/CD settings or in the gitlab runner settings
    - echo "Updating custom executor code in directory $CI_TEST_CODE"
    - test -n "$CI_TEST_CODE"
    - test -d "$CI_TEST_CODE"
    - tar xvf rpmbuild.tar
    - rm -r "$CI_TEST_CODE"
    - mv gitlab-custom-executor-slurm-singularity-enroot "$CI_TEST_CODE"
