apptainer-imagefile-pull:
  dependencies: []
  stage: bootstrap-apptainer
  tags:
    - shell
  variables:
    IMAGEFILE: "$CI_BUILDS_DIR/playground/debian-latest.sif"
  script:
    - pwd # DEBUG
    - env | grep /hkfs/home/project/hk-project-scs/hs2454/builds
    - 'mkdir -p "$(dirname "$IMAGEFILE")"'
    - 'cd "$(dirname "$IMAGEFILE")"'
    - 'apptainer pull "$(basename "$IMAGEFILE")" docker://debian:latest'

apptainer-imagefile-job:
  dependencies: []
  needs:
    - apptainer-imagefile-pull
  stage: bootstrap-apptainer
  tags:
    - slurm
    - apptainer
  variables:
    IMAGEFILE: "$HOME/playground/debian-latest.sif"
  script:
    - grep PRETTY /etc/os-release | grep -i debian


apptainer-imagefile-clean:
  dependencies: []
  needs:
    - apptainer-imagefile-job
  stage: bootstrap-apptainer
  tags:
    - shell
  when: always
  variables:
    IMAGEFILE: "$HOME/playground/debian-latest.sif"
  script:
    - 'cd "$(dirname "$IMAGEFILE")"'
    - 'rm -rf "$(basename "$IMAGEFILE")"'
