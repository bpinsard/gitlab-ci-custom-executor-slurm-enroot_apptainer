# Note: the success of this depends on the settings of
# CI_WS for the 2 runners involved
# (i.e., for the "shell" executor and the "slurm, apptainer" one)
apptainer-imagefile-pull:
  dependencies: []
  stage: test-deploy
  tags:
    - shell
  variables:
    IMAGEFILE: "$CI_WS/playground/debian-latest.sif"
  script:
    - 'echo $IMAGEFILE'
    - 'mkdir -p "$(dirname "$IMAGEFILE")"'
    - 'cd "$(dirname "$IMAGEFILE")"'
    - 'test -e "$(basename "$IMAGEFILE")" || apptainer pull "$(basename "$IMAGEFILE")" docker://debian:latest'

apptainer-imagefile-job-no-image:
  dependencies: []
  needs:
    - apptainer-imagefile-pull
  stage: test-deploy
  tags:
    - slurm
    - apptainer
  variables:
    IMAGEFILE: "$CI_WS/playground/debian-latest.sif"
  script:
    - grep PRETTY /etc/os-release | grep -i debian

apptainer-imagefile-job-with-image:
  dependencies: []
  stage: test-deploy
  image: docker://debian:latest
  tags:
    - slurm
    - apptainer
  variables:
    IMAGEFILE: "$CI_WS/playground/debian-another-image.sif"
  script:
    - grep PRETTY /etc/os-release | grep -i debian

apptainer-imagefile-job-no-image-second-round:
  dependencies: []
  needs:
    - apptainer-imagefile-job-with-image
  stage: test-deploy
  tags:
    - slurm
    - apptainer
  variables:
    IMAGEFILE: "$CI_WS/playground/debian-another-image.sif"
  script:
    - grep PRETTY /etc/os-release | grep -i debian




apptainer-imagefile-clean:
  dependencies: []
  needs:
    - apptainer-imagefile-job-no-image
    - apptainer-imagefile-job-with-image
    - apptainer-imagefile-job-no-image-second-round
  stage: test-deploy
  tags:
    - shell
  when: always
  variables:
    IMAGEFILE1: "$CI_WS/playground/debian-latest.sif"
    IMAGEFILE2: "$CI_WS/playground/debian-another-image.sif"
  script:
    - ls "$IMAGEFILE1"
    - 'cd "$(dirname "$IMAGEFILE1")"'
    - 'rm -rf "$(basename "$IMAGEFILE1")"'
    - ls "$IMAGEFILE2"
    - 'cd "$(dirname "$IMAGEFILE2")"'
    - 'rm -rf "$(basename "$IMAGEFILE2")"'
