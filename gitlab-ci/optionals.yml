unit-test-parallel-optionals:
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test
  script:
    - make test_report_optionals.xml JOBS=8
  tags:
    - shell
  allow_failure: true
  artifacts:
    when: always
    paths:
      - test_report_optionals.xml
    reports:
      junit: test_report_optionals.xml
