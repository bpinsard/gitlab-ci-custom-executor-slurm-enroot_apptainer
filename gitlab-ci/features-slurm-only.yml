minimal-job-slurm-only:
  dependencies: []
  stage: test-deploy
  tags:
    # This needs to match the tag of the test custom executor
    - slurm
    - slurm-only
  script:
    - echo "Test Test"
    - env | sort

artifact-job-slurm-only:
  dependencies: []
  stage: test-deploy
  tags:
    # This needs to match the tag of the test custom executor
    - slurm
    - slurm-only
  script: touch test-artifact.txt
  artifacts:
    paths:
      - test-artifact.txt

env-job-slurm-only:
  dependencies: []
  stage: test-deploy
  tags:
    - slurm
    - slurm-only
  variables:
    ENV_VAR_1: 55
  script:
    - env | grep ENV_VAR_1
    - test $ENV_VAR_1 -eq 55
