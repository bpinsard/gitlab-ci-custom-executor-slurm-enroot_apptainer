horeka-mpi-multinode-job-apptainer:
  dependencies: []
  stage: test-deploy
  tags:
    - slurm
    - apptainer
    - horeka
  variables:
    COMMAND_OPTIONS_SBATCH: "--partition cpuonly -t 20 --ntasks 2 --nodes 2 --ntasks-per-node=1"
  script:
    - |
      srun hostname
      [ "$(srun hostname | sort -u | wc -l)" -eq 2 ] || exit 1

