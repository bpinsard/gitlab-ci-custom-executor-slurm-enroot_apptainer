# localnoskip: tests that typically are not skipped on a dev machine
# dev machine: a machine possibly without slurm and/or enroot and/or apptainer
noslurm-unit-test-parallel-localnoskip-test-deploy:
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    JOB_TIME_SEC: 1800
  stage: test-deploy-noslurm
  script:
    - make test_report_parallel_no_skipped_local.xml JOBS=8
  tags:
    - noslurm
    - nocontainer
  artifacts:
    when: always
    paths:
      - > test_report_parallel_no_skipped_local.xml
    reports:
      junit: > test_report_parallel_no_skipped_local.xml


noslurm-unit-test-critical-test-deploy:
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test-deploy-serial-noslurm-none
  script:
    make test_report_critical.xml
  tags:
    - noslurm
    - nocontainer
  artifacts:
    when: always
    paths:
      - test_report_critical.xml
    reports:
      junit: test_report_critical.xml

noslurm-lint-test-deploy:
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test-deploy-noslurm
  script:
    - make shellcheck
  tags:
    - noslurm
    - nocontainer
