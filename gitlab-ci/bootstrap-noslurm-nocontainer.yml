# localnoskip: tests that typically are not skipped on a dev machine
# dev machine: a machine possibly without slurm and/or enroot and/or apptainer
noslurm-unit-test-parallel-localnoskip-test-deploy:
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    JOB_TIME_SEC: 1800
  stage: test-deploy-noslurm
  script:
    - make test-report-parallel-no-skipped-local JOBS=8 > report_parallel_localnoskip.xml
  tags:
    - noslurm
    - nocontainer
  artifacts:
    when: always
    paths:
      - report_parallel_localnoskip.xml
    reports:
      junit: report_parallel_localnoskip.xml


