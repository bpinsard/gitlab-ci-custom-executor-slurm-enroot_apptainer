noslurm-unit-test-parallel-localnoskip-test-deploy:
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    JOB_TIME_SEC: 1800
  stage: test-deploy-noslurm
  script:
    - make test-report-parallel-no-skipped-local JOBS=8
  tags:
    - noslurm
    - nocontainer
  artifacts:
    when: always
    paths:
      - report-parallel.xml
    reports:
      junit: report-parallel.xml


