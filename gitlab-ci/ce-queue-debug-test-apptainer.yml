# This test,
# run with the slurm+apptainer custom executor
# should create a $HOME/ce-debug directory
# because of CE_DEBUG=2
ce-queue-debug-test-apptainer:
  dependencies: []
  stage: test-deploy-ce-debug-apptainer
  # Making sure this test runs
  # after the test for the enroot version
  # that could conflict with this one
  # since both tests create and delete
  # $HOME/ce-debug
  needs:
    - "ce-queue-debug-post-test-enroot"
  variables:
    CE_DEBUG: 2
  tags:
    - slurm
    - apptainer
  script:
    - echo "Making sure that $HOME/ce-debug/ does not exist before test cleanup..."
    - rm -rf "$HOME/ce-debug/"

# This test is a test for the apptainer executor
# checking that CUSTOM_ENV_CE_DEBUG=2
# set in the `ce-queue-debug-test-apptainer` test
# caused the cleanup script to save the CE workspace
# in $HOME
ce-queue-debug-post-test-apptainer:
  stage: test-deploy-ce-debug-apptainer
  needs:
    - "ce-queue-debug-test-apptainer"
  tags:
    - shell
  script:
    - |
       [ -d "$HOME/ce-debug/" ]
  after_script:
    - rm -rf "$HOME/ce-debug/"
