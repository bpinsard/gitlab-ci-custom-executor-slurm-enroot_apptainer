
minimal-job-enroot:
  dependencies: []
  stage: test-test-deploy
  tags:
    # This needs to match the tag of the test custom executor
    - slurm
    - enroot
  script:
    - echo "Test Test"
    - env | sort

image-job-enroot:
  dependencies: []
  stage: test-test-deploy
  image: docker://debian:latest
  tags:
    # This needs to match the tag of the test custom executor
    - slurm
    - enroot
  script:
    - echo "Test Test using an image"
    - grep PRETTY /etc/os-release
    - env | sort

artifact-job-enroot:
  dependencies: []
  stage: test-test-deploy
  tags:
    # This needs to match the tag of the test custom executor
    - slurm
    - enroot
  script: touch test-artifact.txt
  artifacts:
    paths:
      - test-artifact.txt

artifact-image-job-enroot:
  dependencies: []
  stage: test-test-deploy
  image: docker://debian:latest
  tags:
    # This needs to match the tag of the test custom executor
    - slurm
    - enroot
  script: cp /etc/os-release test-artifact-image.txt
  artifacts:
    paths:
      - test-artifact.txt



env-job-enroot:
  dependencies: []
  stage: test-test-deploy
  tags:
    - slurm
    - enroot
  variables:
    ENV_VAR_1: 55
  script:
    - env | grep ENV_VAR_1
    - test $ENV_VAR_1 -eq 55
