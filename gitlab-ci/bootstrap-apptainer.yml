apptainer-unit-test-parallel-test-deploy:
  when: manual # This test is redundant
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    JOB_TIME_SEC: 1800
  stage: test-deploy
  script:
    - make test-report-parallel-no-skipped-local JOBS=8 > report_parallel.xml
  tags:
    - slurm
    - apptainer
  artifacts:
    when: always
    paths:
      - report_parallel.xml
    reports:
      junit: report_parallel.xml


apptainer-unit-test-critical-test-deploy:
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test-deploy-serial-apptainer
  script:
    - make test-report-critical > report_critical_apptainer.xml
  tags:
    - slurm
    - apptainer
  artifacts:
    when: always
    paths:
      - report_critical_apptainer.xml
    reports:
      junit: report_critical_apptainer.xml


apptainer-lint-test-deploy:
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test-deploy
  script:
    - make shellcheck
  tags:
    - slurm
    - apptainer
