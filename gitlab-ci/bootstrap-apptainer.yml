apptainer-unit-test-parallel-test-deploy:
  when: manual # This test is redundant
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    JOB_TIME_SEC: 1800
  stage: test-deploy
  script:
    - make test_report_parallel_no_skipped_local.xml JOBS=8 
  tags:
    - slurm
    - apptainer
  artifacts:
    when: always
    paths:
      - test_report_parallel_no_skipped_local.xml
    reports:
      junit: test_report_parallel_no_skipped_local.xml


apptainer-unit-test-critical-test-deploy:
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test-deploy-serial-apptainer
  script:
    - make test_report_critical.xml 
  tags:
    - slurm
    - apptainer
  artifacts:
    when: always
    paths:
      - test_report_critical.xml 
    reports:
      junit: test_report_critical.xml 


apptainer-lint-test-deploy:
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test-deploy
  script:
    - make shellcheck
  tags:
    - slurm
    - apptainer
