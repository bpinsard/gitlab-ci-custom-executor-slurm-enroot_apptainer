# Note: the success of this depends on the settings of
# CI_WS for the 2 runners involved.
# (i.e., for the "shell" executor and the "slurm, apptainer" one)
enroot-imagefile-pull:
  dependencies: []
  stage: test-deploy
  tags:
    - shell
  variables:
    IMAGEFILE: "$CI_WS/playground/debian-latest.sqsh"
  script:
    - 'mkdir -p "$(dirname "$IMAGEFILE")"'
    - 'cd "$(dirname "$IMAGEFILE")"'
    - 'test -e "$(basename "$IMAGEFILE")" || enroot import --output "$(basename "$IMAGEFILE")" docker://debian:latest'

enroot-imagefile-job-no-image:
  dependencies: []
  needs:
    - enroot-imagefile-pull
  stage: test-deploy
  tags:
    - slurm
    - enroot
  variables:
    IMAGEFILE: "$CI_WS/playground/debian-latest.sqsh"
  script:
    - grep PRETTY /etc/os-release | grep -i debian

enroot-imagefile-job-with-image:
  dependencies: []
  stage: test-deploy
  image: docker://debian:latest
  tags:
    - slurm
    - enroot
  variables:
    IMAGEFILE: "$CI_WS/playground/debian-another-image.sqsh"
  script:
    - grep PRETTY /etc/os-release | grep -i debian

enroot-imagefile-job-no-image-second-round:
  dependencies: []
  needs:
    - enroot-imagefile-job-with-image
  stage: test-deploy
  tags:
    - slurm
    - enroot
  variables:
    IMAGEFILE: "$CI_WS/playground/debian-another-image.sqsh"
  script:
    - grep PRETTY /etc/os-release | grep -i debian


enroot-imagefile-clean:
  allow_failure: true
  dependencies: []
  needs:
    - enroot-imagefile-job-no-image
    - enroot-imagefile-job-with-image
    - enroot-imagefile-job-no-image-second-round
  stage: test-deploy
  tags:
    - shell
  when: always
  variables:
    IMAGEFILE1: "$CI_WS/playground/debian-latest.sqsh"
    IMAGEFILE2: "$CI_WS/playground/debian-another-image.sqsh"
  script:
    - 'cd "$(dirname "$IMAGEFILE1")"'
    - 'rm -rf "$(basename "$IMAGEFILE1")"'
    - 'cd "$(dirname "$IMAGEFILE2")"'
    - 'rm -rf "$(basename "$IMAGEFILE2")"'
