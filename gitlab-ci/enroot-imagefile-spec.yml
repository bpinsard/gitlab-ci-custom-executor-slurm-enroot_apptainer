# Note: the success of this depends on the settings of
# CI_BUILDS_DIR for the 2 runners involved.
enroot-imagefile-pull:
  dependencies: []
  stage: bootstrap-enroot
  tags:
    - shell
  variables:
    IMAGEFILE: "$CI_BUILDS_DIR/enroot/playground/debian-latest.sqsh"
  script:
    - 'mkdir -p "$(dirname "$IMAGEFILE")"'
    - 'cd "$(dirname "$IMAGEFILE")"'
    - 'test -e "$(basename "$IMAGEFILE")" || enroot import --output "$(basename "$IMAGEFILE")" docker://debian:latest'

enroot-imagefile-job:
  dependencies: []
  needs:
    - enroot-imagefile-pull
  stage: bootstrap-enroot
  tags:
    - slurm
    - enroot
  variables:
    IMAGEFILE: "$CI_BUILDS_DIR/playground/debian-latest.sqsh"
  script:
    - grep PRETTY /etc/os-release | grep -i debian


enroot-imagefile-clean:
  dependencies: []
  needs:
    - enroot-imagefile-job
  stage: bootstrap-enroot
  tags:
    - shell
  when: always
  variables:
    IMAGEFILE: "$CI_BUILDS_DIR/enroot/playground/debian-latest.sqsh"
  script:
    - 'cd "$(dirname "$IMAGEFILE")"'
    - 'rm -rf "$(basename "$IMAGEFILE")"'
