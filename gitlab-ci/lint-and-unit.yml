lint:
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test
  script:
    - make shellcheck
  tags:
    - shell


unit-test-serial:
  when: manual # This test is redundant
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test
  script:
    - make test-report-serial > report_serial.xml
  tags:
    - shell
  artifacts:
    when: always
    paths:
      - report_serial.xml
    reports:
      junit: report_serial.xml


unit-test-parallel:
  when: manual # This test is redundant
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test
  script:
    - make test-report-parallel-no-skipped-local JOBS=8 > report_parallel.xml
  tags:
    - shell
  artifacts:
    when: always
    paths:
      - report_parallel.xml
    reports:
      junit: report_parallel.xml
