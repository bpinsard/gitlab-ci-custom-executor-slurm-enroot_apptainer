lint:
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test
  script:
    - make shellcheck
  tags:
    - shell


unit-test-critical:
  when: manual # This test is redundant
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test
  script:
    - make test_report_critical.xml
  tags:
    - shell
  artifacts:
    when: always
    paths:
      - test_report_critical.xml
    reports:
      junit: test_report_critical.xml


unit-test-parallel:
  when: manual # This test is redundant
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test
  script:
    - make test_report_parallel_no_skipped_local.xml JOBS=8
  tags:
    - shell
  artifacts:
    when: always
    paths:
      - test_report_parallel_no_skipped_local.xml
    reports:
      junit: test_report_parallel_no_skipped_local.xml
