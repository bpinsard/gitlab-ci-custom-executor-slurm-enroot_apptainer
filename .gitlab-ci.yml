
stages:          # List of stages for jobs, and their order of execution
  - test


unit-test-job:
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test
  script:
    - make test-report
  tags:
    - shell
  artifacts:
    when: always
    paths:
      - report.xml
    reports:
      junit: report.xml

lint-test-job:
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test
  script:
    - source ./tests/install_shellcheck.sh
    - make shellcheck
  tags:
    - shell
