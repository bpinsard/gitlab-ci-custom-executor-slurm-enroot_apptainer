
stages:          # List of stages for jobs, and their order of execution
  - test
  - fake-deploy
  - test-fake-deploy

unit-test-parallel:
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test
  script:
    - make test-report-parallel JOBS=8
  after_script:
    - make joker
  tags:
    - shell
  artifacts:
    when: always
    paths:
      - report-parallel.xml
    reports:
      junit: report-parallel.xml


unit-test-serial:
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test
  script:
    - make test-report-serial
  after_script:
    - make joker
  tags:
    - shell
  artifacts:
    when: always
    paths:
      - report-serial.xml
    reports:
      junit: report-serial.xml


lint:
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test
  script:
    - make shellcheck
  tags:
    - shell

update-fake-deploy:
  stage: fake-deploy
  variables:
    - CE_FAKE_DEPLOY_PATH="$HOME"/custom-executor-slurm-fakedeploy
  tags:
    - shell
  before_script:
    - if [[ ! -d "$CE_FAKE_DEPLOY_PATH" ]]; then git clone $CI_REPOSITORY_URL $CE_FAKE_DEPLOY_PATH; fi
  script:
    - cd $CE_FAKE_DEPLOY_PATH
    - git pull


