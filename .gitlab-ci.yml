
stages:          # List of stages for jobs, and their order of execution
  - test


unit-test:
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test
  script:
    - make test-report-parallel
  tags:
    - shell
  artifacts:
    when: always
    paths:
      - report-parallel.xml
    reports:
      junit: report-parallel.xml

lint:
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test
  script:
    - source ./tests/install_shellcheck.sh
    - make shellcheck
  tags:
    - shell
