
stages:          # List of stages for jobs, and their order of execution
  - onlythis
  - test
  - test-deploy
  - test-test-deploy
  - bootstrap

unit-test-onlythis:
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: onlythis
  script:
    - make test-onlythis
  after_script:
    - make joker
  tags:
    - shell

lint:
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test
  script:
    - make shellcheck
  tags:
    - shell


unit-test-serial:
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test
  script:
    - make test-report-serial
  after_script:
    - make joker
  tags:
    - shell
  artifacts:
    when: always
    paths:
      - report-serial.xml
    reports:
      junit: report-serial.xml


unit-test-parallel:
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test
  script:
    - make test-report-parallel JOBS=8
  after_script:
    - make joker
  tags:
    - shell
  artifacts:
    when: always
    paths:
      - report-parallel.xml
    reports:
      junit: report-parallel.xml



update-ce-code:
  stage: test-deploy
  tags: 
    - shell
  variables:
    # This needs to match the one used in the configured test custom executor
    # TODO: remove from this file and put in CI/CD settings
    CI_TEST_CODE: "/home/hk-project-scs/hs2454/custom-executor-slurm-enroot-test-deploy"
  script:
    - cd "$CI_TEST_CODE"
    - git pull $CI_REPOSITORY_URL

minimal-job:
  stage: test-test-deploy
  tags:
    # This needs to match the tag of the test custom executor
    - slurm-enroot-test
  script:
    - echo "Test Test"
    - env | sort

image-job:
  stage: test-test-deploy
  image: ubuntu:latest
  tags:
    # This needs to match the tag of the test custom executor
    - slurm-enroot-test
  script:
    - echo "Test Test using an image"
    - grep PRETTY /etc/os-release
    - env | sort

artifact-job:
  stage: test-test-deploy
  tags:
    # This needs to match the tag of the test custom executor
    - slurm-enroot-test
  script: touch test-artifact.txt
  artifacts:
    paths:
      - test-artifact.txt

artifact-image-job:
  stage: test-test-deploy
  image: ubuntu:latest
  tags:
    # This needs to match the tag of the test custom executor
    - slurm-enroot-test
  script: cp /etc/os-release test-artifact-image.txt
  artifacts:
    paths:
      - test-artifact.txt


horeka-mpi-multinode-job:
  stage: test-test-deploy
  tags:
    - slurm-enroot-test
  variables:
    COMMAND_OPTIONS_SBATCH: "--partition cpuonly -t 20 --nodes 2 --ntasks-per-node=1"
  script:
    - |
      srun hostname
      [ "$(srun hostname | sort -u | wc -l)" -eq 2 ] || exit 1
      

ce-queue-debug-test:
  stage: test-test-deploy
  variables:
    CE_DEBUG: 1
  tags:
    - slurm-enroot-test
  script:
    - rm -rf "$HOME/ce-debug/"
  
ce-queue-debug-post-test:
  stage: test-test-deploy
  needs: 
    - "ce-queue-debug-test"
  tags:
    - shell
  script:
    - |
       [ -d "$HOME/ce-debug/" ]
  after_script:
    - rm -rf "$HOME/ce-debug/"


unit-test-parallel-bootstrap:
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: bootstrap
  script:
    - make test-report-parallel JOBS=8
  after_script:
    - make joker
  tags:
    - slurm-enroot-test
  artifacts:
    when: always
    paths:
      - report-parallel.xml
    reports:
      junit: report-parallel.xml


unit-test-serial-bootstrap:
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: bootstrap
  script:
    - make test-report-serial
  after_script:
    - make joker
  tags:
    - slurm-enroot-test
  artifacts:
    when: always
    paths:
      - report-serial.xml
    reports:
      junit: report-serial.xml


lint-bootstrap:
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: bootstrap
  script:
    - make shellcheck
  tags:
    - slurm-enroot-test

       

