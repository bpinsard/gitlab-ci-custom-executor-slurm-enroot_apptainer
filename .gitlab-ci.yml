
stages:          # List of stages for jobs, and their order of execution
  - test
  - test-deploy
  - test-test-deploy

unit-test-parallel:
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test
  script:
    - make test-report-parallel JOBS=8
  after_script:
    - make joker
  tags:
    - shell
  artifacts:
    when: always
    paths:
      - report-parallel.xml
    reports:
      junit: report-parallel.xml


unit-test-serial:
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test
  script:
    - make test-report-serial
  after_script:
    - make joker
  tags:
    - shell
  artifacts:
    when: always
    paths:
      - report-serial.xml
    reports:
      junit: report-serial.xml


lint:
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: test
  script:
    - make shellcheck
  tags:
    - shell


update-ce-code:
  stage: test-deploy
  tags: 
    - shell
  variables:
    # This needs to match the one used in the configured test custom executor
    # TODO: remove from this file and put in CI/CD settings
    CI_TEST_CODE: "/home/hk-project-scs/hs2454/custom-executor-slurm-enroot-test-deploy"
  script:
    - cd "$CI_TEST_CODE"
    - git pull $CI_REPOSITORY_URL

minimal-job:
  stage: test-test-deploy
  variables:
    # TODO: remove from this file and put in CI/CD settings
    CI_BUILDS_DIR: "/home/hk-project-scs/hs2454/gitlab-runner"
  tags:
    # This needs to match the tag of the test custom executor
    - slurm-enroot-test
  script:
    - echo "Test Test"
    - env | sort

image-job:
  stage: test-test-deploy
  image: ubuntu:latest
  variables:
    # TODO: remove from this file and put in CI/CD settings
    CI_BUILDS_DIR: "/home/hk-project-scs/hs2454/gitlab-runner"
  tags:
    # This needs to match the tag of the test custom executor
    - slurm-enroot-test
  script:
    - echo "Test Test using an image"
    - grep PRETTY /etc/os-release
    - env | sort

artifact-job:
  stage: test-test-deploy
  variables:
    # TODO: remove from this file and put in CI/CD settings
    CI_BUILDS_DIR: "/home/hk-project-scs/hs2454/gitlab-runner"
  tags:
    # This needs to match the tag of the test custom executor
    - slurm-enroot-test
  script: touch test-artifact.txt
  artifacts:
    paths:
